<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
  /* ====== EDIT CLASS TIMES HERE ====== */
  :root{--mag:#ff009d;--teal:#0093ad;--purp:#4e3aa2;--ink:#1d1b26;--muted:#6b6878;--line:#e6e3ee;--soft:#f6f4fb}
  *{box-sizing:border-box}
  body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:var(--soft)}
  header{background:var(--purp);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  header h1{margin:0;font-size:20px;font-weight:700}
  nav{display:flex;gap:6px}
  nav button{background:transparent;border:2px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:8px 14px;font:600 14px Poppins;cursor:pointer;min-height:40px}
  nav button.on{background:#fff;color:var(--purp);border-color:#fff}
  nav button i{display:none;font-style:normal}
  header{flex-wrap:nowrap}header h1{flex:1}header nav{order:3}
  .gear{order:4;background:transparent;border:2px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none}
  .imp{position:relative}.imp summary{list-style:none;cursor:pointer}.imp summary::-webkit-details-marker{display:none}
  .imp .menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(20,10,60,.15);padding:6px;z-index:4;min-width:230px;display:grid}
  .imp .menu>*{border:0;background:none;text-align:left;font:600 15px Poppins;color:var(--ink);padding:12px 12px;border-radius:10px;cursor:pointer;display:block}
  .imp .menu>*:hover{background:var(--soft)}
  .daynav .today{padding:8px 12px}
  @media (max-width:640px){
    header{padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
    header h1{font-size:18px}
    nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:0;box-shadow:0 -4px 16px rgba(20,10,60,.06)}
    nav button{flex:1;border:0;border-radius:12px;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;min-height:54px}
    nav button i{display:block;font-size:20px;line-height:1}
    nav button.on{background:var(--soft);color:var(--purp)}
    main{padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
    .card{padding:14px;border-radius:14px}
    .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
    .daynav{gap:6px}.daynav .btn{min-width:40px;padding:8px 0}.daynav .today{padding:8px 12px}
    .daynav input{font-size:16px;padding:8px 10px}
    .arr{padding:10px 12px;gap:8px}.arr .t{min-width:62px;font-size:14px}.daynav .today{font-size:15px}
  }
  main{max-width:760px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  label.l{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
  input,select{width:100%;font:500 17px Poppins;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-height:48px}
  input:focus,select:focus{outline:none;border-color:var(--teal)}
  .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .gl{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .g{display:flex;gap:8px;align-items:center}
  .g .n{width:28px;font-weight:700;color:var(--muted);text-align:center}
  .g input{flex:1}
  .seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
  .seg button{border:0;background:#fff;font:800 15px Poppins;padding:0;width:48px;min-height:44px;cursor:pointer;color:var(--muted)}
  .pj{display:flex;align-items:center;border:2px solid var(--line);border-radius:12px;flex:none}
  .pj button{border:0;background:none;font:700 18px Poppins;width:32px;min-height:40px;cursor:pointer;color:var(--muted)}
  .pj span{min-width:16px;text-align:center;font-weight:700}
  .pj.multi{border-color:var(--purp)}.pj.multi span{color:var(--purp)}
  .seg button.on.ft{background:var(--teal);color:#fff}
  .seg button.on.rg{background:var(--mag);color:#fff}
  .x{border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer;width:36px;height:44px}
  .btn{border:0;border-radius:999px;font:700 16px Poppins;padding:14px 22px;cursor:pointer;min-height:48px}
  .btn.main{background:var(--mag);color:#fff;width:100%;font-size:18px}
  .btn.ghost{background:#fff;border:2px solid var(--line);color:var(--ink)}
  .btn.small{padding:8px 14px;font-size:14px;min-height:40px}
  .btn:disabled{opacity:.5;cursor:default}
  .add{margin-top:10px}
  .party{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .ph{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
  .ph b{font-size:17px}
  .ph span{color:var(--muted);font-size:14px}
  .gi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);margin-top:8px}
  .tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;color:#fff}
  .tag.NEW{background:var(--purp)}.tag.WEB{background:var(--purp);font-size:10px;vertical-align:middle}.tag.LATE{background:#c40056;font-size:10px;vertical-align:middle}.tag.FH{background:#0b7a3e;font-size:10px;vertical-align:middle}
  .dep{display:block;font-size:13px;font-weight:700;color:#0b7a3e}
  .tools{display:flex;gap:6px;margin:4px 0 2px 4px;flex-wrap:wrap}.tl{border:0;background:none;color:var(--muted);font:600 13px Poppins;padding:4px 8px;border-radius:8px;cursor:pointer}.tl:hover{background:var(--soft);color:var(--ink)}
  .mv{display:flex;gap:8px;margin:6px 0 4px;flex-wrap:wrap}.mv input,.mv select{flex:1;min-width:140px;min-height:44px;padding:8px 10px;font-size:15px}
  .arrw{margin-bottom:8px}.arrw .arr{margin-bottom:0}.feebtn{margin:6px 0 4px;border-color:#c40056;color:#c40056}.feerow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 4px 4px}.feerow .feebtn{margin:0}.feebtn.waive{border-color:var(--line);color:var(--muted)}.feeln{font-size:13px;color:#1a8a3a;font-weight:600;margin:4px 0 0 4px}
  .arr:disabled{cursor:default}.party.isnew{border:2px solid var(--mag)}
  .tag.FT{background:var(--teal)}.tag.RG{background:var(--mag)}
  .muted{color:var(--muted);font-size:14px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;display:none;z-index:5}
  .hide{display:none!important}
  .sday{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .sday.closed{background:#fff5f8}
  .scls{display:grid;grid-template-columns:120px 1fr auto auto auto;align-items:center;gap:14px;padding:14px 18px}
  .scls.off{opacity:.6;background:#fafafa}
  .stime b{display:block;font-size:18px}.stime .muted{font-size:13px}
  .sbar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}.sbar div{height:100%;background:var(--teal);border-radius:999px}
  .scls.off .sbar div{background:#bbb}
  .scount{font-size:14px;color:var(--muted);white-space:nowrap}.scount b{color:var(--ink);font-size:18px}
  .scap{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px}
  .scap{padding:0 12px 0 0}.scap input{width:74px;border:0;text-align:center;font:800 22px Poppins;min-height:48px;padding:0;background:transparent}
  .scap input:focus{outline:none}.scap:focus-within{border-color:var(--teal)}.seatl{font-size:13px;color:var(--muted);font-weight:600}
  .scap input.saving{color:var(--muted)}
  @media (max-width:640px){.scls{grid-template-columns:1fr auto;}.sbar{grid-column:1/-1;order:3}.scount{order:4}}
  .daynav{display:flex;gap:8px;align-items:center;margin:0 0 10px}.daynav input{flex:1;min-width:0}.daynav .btn{min-width:44px;font-size:18px}
  .pk{max-height:300px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:6px 8px 10px}
  .pc{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;margin:0 6px 6px 0;font:600 14px Poppins;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--purp);border-color:var(--purp);color:#fff}
  .si{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
  .modal{position:fixed;inset:0;background:rgba(29,27,38,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
  .mbox{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:360px;text-align:center}
  .arr{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:8px;font:500 16px Poppins;color:var(--ink);cursor:pointer;min-height:54px}
  .arr:hover{border-color:var(--teal)}
  .arr .t{font-weight:700;color:var(--purp);min-width:78px}
  .arr .nm{flex:1;font-weight:600}
  .arr .sz{background:var(--soft);border-radius:999px;padding:2px 10px;font-weight:700;font-size:14px}
  .arr.in{opacity:.45}
  .arr.sel{border-color:var(--mag);background:#fff0f8}
  .loc{display:inline-block;background:var(--purp);color:#fff;font-weight:800;font-size:18px;padding:4px 12px;border-radius:10px;letter-spacing:.5px}
  .st{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--soft);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .sf{margin-top:10px;padding:12px;border:2px solid var(--teal);border-radius:12px;display:grid;gap:10px}
  .sf .r3{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px}
  .chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px}
  .chk input{width:22px;height:22px;min-height:0}
  .done{color:#1a8a3a;font-weight:700}
  @media (max-width:560px){.sf .r3{grid-template-columns:1fr 1fr}.sf .r3>:nth-child(2){grid-column:1/-1;order:-1}}

  /* ====== LABEL: 3in x 2in ====== */
  #print{display:none}
  @page{size:3in 2in;margin:0}
  @media print{
    body{background:#fff}
    body>*:not(#print){display:none!important}
    #print{display:block}
  }
  .lbl{width:3in;height:2in;padding:.09in .12in;display:flex;flex-direction:column;justify-content:space-between;page-break-after:always;break-after:page;overflow:hidden;color:#000;font-family:Poppins,Arial,sans-serif}
  .lbl:last-child{page-break-after:auto;break-after:auto}
  .lbl .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
  .lbl .rn{font-weight:800;line-height:1.02;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
  .lbl .gn{font-weight:600;font-size:15pt;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lbl .mid{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .lbl .ty{font-weight:800;font-size:10pt;padding:1pt 5pt;border:1.5pt solid #000;border-radius:4pt;white-space:nowrap;flex:none}
  .lbl .ty.FT{background:#000;color:#fff}
  .lbl .when{font-weight:600;font-size:10pt;line-height:1.15}
  .lbl .ft{display:flex;justify-content:space-between;gap:4pt;white-space:nowrap;font-size:6.5pt;border-top:1pt solid #000;padding-top:2pt}
</style>
</head>
<body>
<header>
  <h1>Abstract Check-In</h1>
  <button class="gear" onclick="openSettings()" aria-label="Printer settings" title="Printer settings">⚙︎</button>
  <nav>
    <button id="tabNew" class="on" onclick="show('new')"><i>✚</i><span>Check in</span></button>
    <button id="tabToday" onclick="show('today')"><i>✓</i><span>Checked in</span></button>
    <button id="tabFind" onclick="show('find')"><i>⌂</i><span>Pickup</span></button>
    <button id="tabSched" onclick="show('sched')"><i>▦</i><span>Schedule</span></button>
  </nav>
</header>

<main>
  <!-- CHECK IN -->
  <section id="vNew">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <b style="font-size:17px" id="arrTitle">Arriving today</b>
        <details class="imp" id="impMenu"><summary class="btn ghost small">Import ▾</summary>
          <div class="menu" onclick="setTimeout(()=>$('impMenu').open=false,50)">
            <button type="button" id="mailBtn" onclick="checkEmail()">Check email for new report</button>
            <label>Import Toast file<input type="file" id="bkFile" accept=".csv,.xlsx,.xls" class="hide" onchange="importFile(this)"></label>
            <label>Import FareHarbor file<input type="file" id="fhFile" accept=".csv,.xlsx,.xls" class="hide" onchange="importFH(this)"></label>
          </div></details>
      </div>
      <div class="daynav">
        <button type="button" class="btn ghost small" onclick="shiftDay(-1)" aria-label="Previous day">‹</button>
        <input id="arrDay" type="date" onchange="setArrDay(this.value)">
        <button type="button" class="btn ghost small" onclick="shiftDay(1)" aria-label="Next day">›</button>
        <button type="button" class="btn ghost small today" onclick="setArrDay(today())">Today</button>
      </div>
      <input id="bkFilter" placeholder="Search reservations…" oninput="renderArrivals()" autocomplete="off">
      <div id="arrivals" style="margin-top:10px;max-height:330px;overflow:auto"></div>
    </div>
    <div class="card" id="formTop">
      <label class="l" for="res">Reservation name</label>
      <input id="res" placeholder="e.g. Beatriz Castro Silva" autocomplete="off">
      <div class="row" style="margin-top:12px">
        <div><label class="l" for="ph">Phone</label><input id="ph" type="tel" placeholder="(407) 555-1234" autocomplete="off"></div>
        <div><label class="l" for="em">Email</label><input id="em" type="email" placeholder="name@email.com" autocomplete="off" autocapitalize="off"></div>
      </div>
      <div class="row" style="margin-top:12px">
        <div><label class="l" for="dt">Class day</label><input id="dt" type="date" onchange="setArrDay(this.value)"></div>
        <div><label class="l" for="tm">Class time</label><select id="tm"></select></div>
      </div>
    </div>
    <div class="card">
      <label class="l">Guests · FT = first timer, RG = returning guest · number = stickers to print</label>
      <div id="guests" class="gl"></div>
      <button class="btn ghost small add" onclick="addGuest()">+ Add guest</button>
      <button class="btn ghost small add" onclick="addMany()">+ Add 4</button>
    </div>
    <button id="saveBtn" class="btn main" onclick="saveAndPrint()">Check in &amp; print labels</button>
    <p class="muted" style="text-align:center">Saves to the Google Sheet, then opens the print dialog.</p>
  </section>

  <!-- TODAY -->
  <section id="vToday" class="hide">
    <div class="card" style="display:flex;gap:10px;align-items:end">
      <div style="flex:1"><label class="l" for="dayPick">Date</label><input id="dayPick" type="date" onchange="loadDay()"></div>
      <button class="btn ghost small" onclick="loadDay()">Refresh</button>
    </div>
    <div id="newBar" class="card hide" style="border:2px solid var(--mag);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <b id="newCount" style="font-size:17px"></b>
      <button class="btn main" style="width:auto;font-size:16px" onclick="printNew()">Print new labels</button>
    </div>
    <div id="dayList"><p class="muted">Loading…</p></div>
  </section>

  <!-- SCHEDULE -->
  <section id="vSched" class="hide">
    <div class="card">
      <div class="daynav" style="margin:0">
        <button type="button" class="btn ghost small" onclick="schedShift(-1)" aria-label="Previous day">‹</button>
        <input id="schedDay" type="date" onchange="loadSched()">
        <button type="button" class="btn ghost small" onclick="schedShift(1)" aria-label="Next day">›</button>
        <button type="button" class="btn ghost small" onclick="$('schedDay').value=today();loadSched()">Today</button>
      </div>
    </div>
    <div id="schedBox"><p class="muted">Loading…</p></div>
  </section>

  <!-- FIND -->
  <section id="vFind" class="hide">
    <div class="card">
      <label class="l" for="q">Pickup: search reservation or guest name</label>
      <input id="q" placeholder="Type a name…" oninput="debFind()">
      <datalist id="pieceTypes"></datalist>
    </div>
    <div id="findList"></div>
  </section>
</main>

<div id="print"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<div id="printModal" class="modal hide"><div class="mbox">
  <div style="font-size:44px">🏷️</div><h2 id="pmCount" style="margin:6px 0 4px">Stickers</h2>
  <p class="muted" style="margin:0 0 18px">ready for the Rollo</p>
  <button class="btn main" onclick="sendToPrinter()">Print</button>
  <button class="btn ghost" style="width:100%;margin-top:10px" onclick="$('printModal').classList.add('hide')">Cancel</button>
</div></div>
<div id="setModal" class="modal hide"><div class="mbox" style="text-align:left">
  <h2 style="margin:0 0 6px">Printer settings</h2>
  <p class="muted" style="margin:0 0 16px">Saved on this device only.</p>
  <label class="chk" style="font-size:16px"><input type="checkbox" id="rotChk"> Turn sticker 90° (use if it prints sideways)</label>
  <div style="display:flex;gap:8px;margin-top:18px"><button class="btn ghost" style="flex:1" onclick="testPrint()">Test print</button><button class="btn main" style="flex:1" onclick="saveSettings()">Save</button></div>
</div></div>
<div id="toast" class="toast"></div>

<script>
/* ====== EDIT CLASS TIMES HERE (in order) ====== */
const OLD_TIMES = ['11:00 AM','12:30 PM','2:00 PM','3:30 PM','5:00 PM'];   // through Dec 31, 2026
const NEW_FROM = '2027-01-01';                                              // new hours start this day
const NEW_TIMES = {                                                         // Sun=0 … Sat=6
  3:['3:00 PM','4:30 PM','6:00 PM','7:30 PM'], 4:['3:00 PM','4:30 PM','6:00 PM','7:30 PM'], 5:['3:00 PM','4:30 PM','6:00 PM','7:30 PM'],
  6:['12:00 PM','1:30 PM','3:00 PM','4:30 PM','6:00 PM'], 0:['12:00 PM','1:30 PM','3:00 PM','4:30 PM']
};
// Class times for a date (YYYY-MM-DD). Keep in sync with Booking.gs.
function timesFor(date){
  if(!date||date<NEW_FROM)return OLD_TIMES;
  const [y,m,d]=date.split('-').map(Number);const t=NEW_TIMES[new Date(y,m-1,d).getDay()];
  return t&&t.length?t:NEW_TIMES[6];   // closed day (Mon/Tue): show Saturday's times so a walk-in can still be entered
}
function fillTimes(sel,date,keep){const ts=timesFor(date);sel.innerHTML=ts.map(t=>`<option${t===keep?' selected':''}>${t}</option>`).join('');if(!ts.includes(keep))sel.value=ts[0]}
const STUDIO = 'Abstract Orlando · (689) 348-8239';
const FEE_PER_GUEST = 50; // keep in sync with BOOK.feePerGuest in Booking.gs
/* ====== PIECE TYPES (suggestions when storing) ====== */
const PIECE_TYPES = {
  /* Project names as listed in FareHarbor */
  'Bears':['Kodiak','Silvertip','Grizzly','Yearling','Cub'],
  'Piggy Banks':['626','Floppy','Winnie','Kitty','Fluffy','Cooper','The Bat','Labubu'],
  'Sculptures':['Air Abstract','Heart Sculpture','Topolino/Topolina','Trooper','Snoopy','Skully','Tars','Gargantua','Turbo'],
  'Vases & Lamp':['Daisy- 8" Glass Vase','Magnolia- 10" Glass Vase','Halo'],
  'Coasters & Trays':['Ear Coasters','Tapas','Goya Bamboo Tray','Dali Bamboo Tray','Warhol Acacia Tray'],
  'Art Pieces':['Banksy','Pollock','Frida','Hilma'],
  'Wall Cutouts':['Melody Guitar','The Boss','High Four','Castle','Ears','Crush','Sunshine','Surfboard','Shark','T-REX','Smiley'],
  'Canvases':['Degas Canvas','Monet Canvas','Van Gogh Canvas']
};

/* ====== YOUR APPS SCRIPT WEB APP LINK (ends in /exec) ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwvba_1OZKz5alSsEVV8pXWKUQJN5wmur6ACjaUD1grRUbJoFN0zJJ5verK4omhuygcKw/exec';

/* ---------- server bridge (demo store if API_URL is empty) ---------- */
const hasGAS = !!API_URL;
const demo = {rows:[],st:{},
  wrap(r){return Object.assign({},r,{storage:this.st[r.partyId]||null})},
  saveParty(p){const id=Math.random().toString(36).slice(2,10).toUpperCase();const out=p.guests.map((g,i)=>({row:this.rows.length+2+i,ts:Date.now(),date:p.date,time:p.time,reservation:p.reservation,size:p.guests.length,num:i+1,name:g.name,type:g.type,projects:g.projects||1,partyId:id,printed:0,phone:p.phone,email:p.email}));this.rows.push(...out);return out.map(r=>this.wrap(r))},
  getDay(d){return this.rows.filter(r=>r.date===d).slice().reverse().map(r=>this.wrap(r))},
  search(q){q=q.toLowerCase();return this.rows.filter(r=>r.name.toLowerCase().includes(q)||r.reservation.toLowerCase().includes(q)).slice().reverse().map(r=>this.wrap(r))},
  markPrinted(rows){rows.forEach(n=>{const r=this.rows.find(x=>x.row===n);if(r)r.printed++});return true},
  updateGuest(row,n,t,pj){const r=this.rows.find(x=>x.row===row);r.name=n;r.type=t;if(pj)r.projects=pj;return this.wrap(r)},
  updateContact(pid,ph,em){this.rows.filter(r=>r.partyId===pid).forEach(r=>{r.phone=ph;r.email=em});return true},
  storeParty(s){const o=this.st[s.partyId]||{};this.st[s.partyId]={location:s.location.toUpperCase(),pieceType:s.pieceType,pieces:+s.pieces,emailSent:o.emailSent||s.notify,textSent:o.textSent||s.notify,pickedUp:o.pickedUp||false};return {email:s.notify?'sent':'skipped',text:s.notify?'sent':'skipped'}},
  addGuestToParty(pid,name,type){const party=this.rows.filter(r=>r.partyId===pid);const f=party[0];const size=party.length+1;party.forEach(r=>r.size=size);
    const g=Object.assign({},f,{row:this.rows.length+2,num:size,size,name,type,projects:1,printed:0});this.rows.push(g);return this.wrap(g)},
  markPickedUp(pid){this.st[pid].pickedUp=true;return true}};
function call(fn,...args){
  return new Promise((res,rej)=>{
    if(!hasGAS){try{res(demo[fn](...args))}catch(e){rej(e)}return}
    // text/plain body = no CORS preflight; no cookies = no Google sign-in problems
    fetch(API_URL,{method:'POST',body:JSON.stringify({pin:PIN,fn,args}),redirect:'follow',credentials:'omit'})
      .then(r=>r.json()).then(j=>{
        if(j.ok)return res(j.data);
        if(/Wrong PIN/.test(j.error))askPin(true);
        rej(new Error(j.error));
      }).catch(()=>rej(new Error('No connection — check Wi-Fi')));
  });
}

const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function niceDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function cap(s){s=s.trim();return s.charAt(0).toUpperCase()+s.slice(1)}
function titleCase(s){return s.trim().replace(/\s+/g,' ').split(' ').map(cap).join(' ')}
function toast(m,ms){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms||2600)}
function nearestTime(){
  const now=new Date(),mins=now.getHours()*60+now.getMinutes();
  const toM=t=>{let [h,mm]=t.split(/[: ]/);h=+h;const pm=/PM/.test(t);if(pm&&h!==12)h+=12;if(!pm&&h===12)h=0;return h*60+ +mm};
  const ts=timesFor($('dt').value||today());let best=ts[0],bd=1e9;ts.forEach(t=>{const d=Math.abs(toM(t)-mins);if(d<bd){bd=d;best=t}});return best;
}

function resSize(n){const L=n.length;return L<=10?34:L<=14?28:L<=18?24:L<=24?21:18}
/* ---------- STICKERS: drawn as an exact 3" x 2" PDF so every device prints the same ---------- */
const DPI=300,LW=900,LH=600,PAD=30,pt=n=>Math.round(n*DPI/72);
let ROTATE=false;try{ROTATE=localStorage.getItem('abs_rot')==='1'}catch(e){}
const isTouch=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function wrap(ctx,text,maxW){const words=text.split(' ');const lines=[];let cur='';
  words.forEach(w=>{const t=cur?cur+' '+w:w;if(ctx.measureText(t).width<=maxW||!cur)cur=t;else{lines.push(cur);cur=w}});if(cur)lines.push(cur);return lines}
function drawLabel(ctx,g){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,LW,LH);ctx.fillStyle='#000';ctx.textBaseline='alphabetic';ctx.textAlign='left';
  const P=34,maxW=LW-P*2;
  // FT / RG box: top-right corner
  ctx.font=`800 ${pt(13)}px Poppins, Arial, sans-serif`;
  const tw=ctx.measureText(g.type).width+44,th=pt(13)+24,tx=LW-P-tw,ty=P;
  ctx.lineWidth=7;if(g.type==='FT'){ctx.fillRect(tx,ty,tw,th);ctx.fillStyle='#fff'}else ctx.strokeRect(tx+3.5,ty+3.5,tw-7,th-7);
  ctx.fillText(g.type,tx+22,ty+th-19);ctx.fillStyle='#000';
  // reservation name: biggest size that fits in 2 lines, beside the box
  const resW=maxW-tw-24;let size=40,lines;
  for(;size>=14;size--){ctx.font=`800 ${pt(size)}px Poppins, Arial, sans-serif`;lines=wrap(ctx,g.reservation,resW);if(lines.length<=2&&lines.every(l=>ctx.measureText(l).width<=resW))break}
  let y=P-pt(size)*0.12;lines.slice(0,2).forEach(l=>{y+=pt(size)*0.98;ctx.fillText(l,P,y)});
  // bottom line: day + time left, QTY right
  const by=LH-P-4;ctx.font=`700 ${pt(12)}px Poppins, Arial, sans-serif`;
  ctx.fillText(`${niceDate(g.date)} · ${g.time}`,P,by);
  ctx.font=`800 ${pt(12)}px Poppins, Arial, sans-serif`;ctx.textAlign='right';ctx.fillText(`QTY: ${g.size}`,LW-P,by);ctx.textAlign='left';
  // guest first name
  ctx.font=`700 ${pt(19)}px Poppins, Arial, sans-serif`;
  let nm=g.name;while(ctx.measureText(nm).width>maxW&&nm.length>2)nm=nm.slice(0,-2)+'…';
  ctx.fillText(nm,P,by-pt(12)-46);
}
async function makePdf(copies){
  try{await Promise.all(['800','700','500'].map(w=>document.fonts.load(`${w} 40px Poppins`)))}catch(e){}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF(ROTATE?{orientation:'portrait',unit:'in',format:[2,3]}:{orientation:'landscape',unit:'in',format:[2,3]});
  const c=document.createElement('canvas'),ctx=c.getContext('2d');
  copies.forEach((g,i)=>{
    c.width=LW;c.height=LH;drawLabel(ctx,g);
    let img=c;
    if(ROTATE){const r=document.createElement('canvas');r.width=LH;r.height=LW;const rc=r.getContext('2d');rc.translate(LH,0);rc.rotate(Math.PI/2);rc.drawImage(c,0,0);img=r}
    if(i)doc.addPage(ROTATE?[2,3]:[3,2],ROTATE?'portrait':'landscape');
    doc.addImage(img.toDataURL('image/png'),'PNG',0,0,ROTATE?2:3,ROTATE?3:2);
  });
  return doc.output('blob');
}
let pendingPdf=null;
async function printLabels(list){
  if(!list.length)return;
  const copies=[];list.forEach(g=>{const n=g.projects||1;
    if(g.onlyProject)copies.push(Object.assign({},g,{pk:g.onlyProject,pn:n}));
    else for(let k=1;k<=n;k++)copies.push(Object.assign({},g,{pk:k,pn:n}))});
  let blob;try{blob=await makePdf(copies)}catch(e){toast('Could not make stickers: '+(e.message||e),5000);return}
  pendingPdf={blob,count:copies.length};
  if(isTouch){$('pmCount').textContent=copies.length+' sticker'+(copies.length>1?'s':'');$('printModal').classList.remove('hide')}
  else sendToPrinter();
  if(list[0].row){list.forEach(g=>g.printed=(g.printed||0)+1);call('markPrinted',list.map(g=>g.row)).then(()=>{if(!$('vToday').classList.contains('hide'))loadDay(true)}).catch(()=>{})}
}
async function sendToPrinter(){
  if(!pendingPdf)return;const {blob}=pendingPdf;$('printModal').classList.add('hide');
  if(isTouch){
    const file=new File([blob],'abstract-stickers.pdf',{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}
    window.open(URL.createObjectURL(blob),'_blank');return;
  }
  const url=URL.createObjectURL(blob);let f=$('pdfFrame');
  if(!f){f=document.createElement('iframe');f.id='pdfFrame';f.style.cssText='position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';document.body.appendChild(f)}
  f.onload=()=>{setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){window.open(url,'_blank')}},300)};
  f.src=url;
}

/* ---- storage form: pick one or more piece types, with a count for each ---- */
let pickMap={};
function parsePieces(str,total){const m={};if(!str)return m;
  str.split(/,\s*/).forEach(x=>{const r=/^(\d+)\s*[×x]\s*(.+)$/.exec(x.trim());if(r)m[r[2]]=+r[1];else if(x.trim())m[x.trim()]=0});
  const known=Object.values(m).reduce((a,b)=>a+b,0);Object.keys(m).forEach(k=>{if(!m[k])m[k]=Math.max(1,(total||1)-known)});return m}
function piecesText(m){return Object.entries(m).map(([k,v])=>`${v}× ${k}`).join(', ')}
function openStore(id){
  const box=$('sf_'+id);if(box.innerHTML){box.innerHTML='';return}
  const p=parties[id],s=p[0].storage||{},first=!p[0].storage;
  pickMap[id]=parsePieces(s.pieceType,s.pieces);

    <div><label class="l">Shelf</label><input id="loc_${id}" placeholder="e.g. B-23 (or B-23, C-4)" value="${esc(s.location||'')}" autocapitalize="characters"></div>
    <div><label class="l">Pieces (tap every type that's going on the shelf)</label>
      <div id="sel_${id}" class="sel"></div>

      <div id="pk_${id}" class="pk"></div></div>

function renderPicker(id){

  $('sel_'+id).innerHTML=Object.keys(m).length?Object.entries(m).map(([k,v])=>`<div class="si"><b>${esc(k)}</b>

  }).join('')||'<p class="muted">No match.</p>';

function bump(id,k,d){const m=pickMap[id];
  if(d===0){delete m[k]}else{m[k]=(m[k]||0)+d;if(m[k]<=0)delete m[k]}
  renderPicker(id)}
async function saveStore(id){

  }catch(e){toast('Could not save: '+(e.message||e))}
}

async function loadArrivals(quiet){

function tMin(t){const m=/(\d+):(\d+)\s*(AM|PM)/i.exec(t||'');if(!m)return 9999;let h=+m[1]%12;if(/pm/i.test(m[3]))h+=12;return h*60+ +m[2]}
let showDone=false;
function renderArrivals(){
  const q=$('bkFilter').value.trim().toLowerCase();
  const isToday=$('dt').value===today(),now=new Date(),nowM=now.getHours()*60+now.getMinutes();
  // a class drops off the list once checked in, or 2 hours after it started (no-show)
  const isPast=b=>b.date<today()||(isToday&&tMin(b.time)+120<nowM);
  const done=b=>b.partyId||b.status!=='Confirmed'||isPast(b);
  const all=arrivals.filter(b=>!q||b.reservation.toLowerCase().includes(q)).sort((a,b)=>tMin(a.time)-tMin(b.time));
  const hidden=q?[]:all.filter(done);
  const list=(q||showDone)?all:all.filter(b=>!done(b));
  if(!arrivals.length){$('arrivals').innerHTML='<p class="muted">No bookings for this date yet. Website bookings show up here on their own; for Toast, tap <b>Import file</b>. Or just type below.</p>';return}
  $('arrivals').innerHTML=list.map(b=>{
    const off=b.status!=='Confirmed';
    const tag=b.source==='Website'?' <span class="tag WEB">WEB</span>':b.source==='FareHarbor'?' <span class="tag FH">FH</span>':'';
    const dep=b.source==='FareHarbor'?`<span class="dep">${b.deposit?'$'+money(b.deposit)+' deposit paid · take off bill':'FareHarbor booking · check deposit'}</span>`:'';
    const st=b.status==='Late cancel'?' <span class="tag LATE">LATE CANCEL</span>':b.status==='No-show'?' <span class="tag LATE">NO-SHOW</span>':b.status==='Cancelled'?' <span class="tag LATE">CANCELLED</span>':'';
    const fee=FEE_PER_GUEST*b.size;
    const feeKind=b.status==='Late cancel'?'late':b.status==='No-show'?'noshow':'';
    const fb=(label,amt,cls)=>`<button class="btn ghost small feebtn${cls||''}" onclick="chargeFee('${b.bookingId}','${feeKind}',${fee},${amt})">${label}</button>`;
    const act=!b.card?'':b.fee?`<div class="feeln">${/^Waived/.test(b.fee)?'Fee waived':'✓ Fee charged: '+esc(b.fee.split(' · ')[0])}</div>`
      :feeKind?`<div class="feerow"><span class="muted" style="font-size:13px">${feeKind==='late'?'Late-cancel':'No-show'} fee:</span>${fb('Charge full $'+fee,'null')}${fb('Partial…','-1')}${fb('Waive','0',' waive')}</div>`:'';
    const k=encodeURIComponent(b.key);
    const tools=b.partyId?'':b.status==='Confirmed'
      ?`<div class="tools"><button class="tl" onclick="staffAct('${k}','noshow')">No-show</button><button class="tl" onclick="staffAct('${k}','cancel')">Cancel</button><button class="tl" onclick="openMove('${k}')">Move</button></div><div id="mv_${k}"></div>`
      :`<div class="tools"><button class="tl" onclick="staffAct('${k}','restore')">Undo · put back on the list</button></div>`;
    return `<div class="arrw"><button class="arr${b.partyId||off?' in':''}${picked&&picked.row===b.row?' sel':''}" ${off?'disabled':''} onclick="pick(${b.row})">
    <span class="t">${esc(b.time)}</span><span class="nm">${b.partyId?'✓ ':''}${esc(b.reservation)}${tag}${st}${dep}${b.note?`<br><span class="muted" style="font-weight:500;font-style:italic">“${esc(b.note)}”</span>`:''}</span><span class="sz">${b.size}</span></button>${tools}${act}</div>`}).join('')+
    (hidden.length?`<button class="btn ghost small" style="margin-top:4px" onclick="showDone=!showDone;renderArrivals()">${showDone?'Hide':'Show'} checked in &amp; past (${hidden.length})</button>`:'')
    ||'<p class="muted">No match.</p>';
}
function bookingByKey(k){return arrivals.find(b=>b.key===decodeURIComponent(k))}
async function staffAct(k,action){
  const b=bookingByKey(k);if(!b)return;const web=b.source==='Website'&&b.email;let email=false;
  if(action==='noshow'&&!confirm(`Mark ${b.reservation} as a NO-SHOW?`+(b.card?`\n\nYou'll then see a button to charge the $${FEE_PER_GUEST*b.size} no-show fee.`:'')))return;
  if(action==='cancel'){if(!confirm(`Cancel ${b.reservation}'s booking (party of ${b.size})?\nTheir seats open up again. No fee is charged.`))return;
    if(web)email=confirm(`Let ${b.reservation} know their booking is cancelled?`)}
  try{await call('staffUpdate',b.key,action,{email});toast({noshow:'Marked no-show',cancel:'Booking cancelled',restore:'Back on the list'}[action]);showDone=action!=='restore'?showDone:false;loadArrivals()}
  catch(e){toast('Could not update: '+(e.message||e),5000)}
}
function openMove(k){
  const box=$('mv_'+k);if(box.innerHTML){box.innerHTML='';return}const b=bookingByKey(k);
  box.innerHTML=`<div class="mv"><input type="date" id="mvd_${k}" value="${b.date}" onchange="fillTimes($('mvt_${k}'),this.value,$('mvt_${k}').value)"><select id="mvt_${k}">${timesFor(b.date).map(t=>`<option${t===b.time?' selected':''}>${t}</option>`).join('')}</select>
    <button class="btn main" style="width:auto;font-size:15px;min-height:44px;padding:0 18px" onclick="saveMove('${k}')">Move</button></div>`;
}
async function saveMove(k){
  const b=bookingByKey(k),date=$('mvd_'+k).value,time=$('mvt_'+k).value;const web=b.source==='Website'&&b.email;
  const email=web&&confirm(`Let ${b.reservation} know their new time (${niceDate(date)} · ${time})?`);
  try{let r=await call('staffUpdate',b.key,'move',{date,time,email});
    if(r.needsForce){if(!confirm(`That class only has ${Math.max(0,r.left)} spot(s) left for a party of ${b.size}. Move them anyway?`))return;
      r=await call('staffUpdate',b.key,'move',{date,time,email,force:true})}
    toast(`Moved to ${niceDate(date)} · ${time}`,3500);loadArrivals()}
  catch(e){toast('Could not move: '+(e.message||e),5000)}
}
async function chargeFee(id,kind,full,amt){
  const bk=arrivals.find(x=>x.bookingId===id),name=bk?bk.reservation:'this guest';
  const why=kind==='noshow'?'not showing up':'cancelling late';
  if(amt===-1){const v=prompt(`How much should we charge ${name} for ${why}? (up to $${full})`,'');if(v===null)return;
    amt=parseFloat(String(v).replace(/[^\d.]/g,''));if(!(amt>0&&amt<=full)){toast(`Enter an amount between $1 and $${full}`,4000);return}}
  if(amt===0){if(!confirm(`Waive the fee for ${name}? Nothing will be charged.`))return}
  else if(!confirm(`Charge ${name} $${amt===null?full:amt} for ${why}?\nThis charges the card they saved when booking.`))return;
  try{const r=await call('chargeFee',id,kind,amt);toast(r.waived?'Fee waived ✓':`Charged $${r.charged} ✓`,4000);loadArrivals()}
  catch(e){toast('Not charged: '+(e.message||e),6000)}
}

function pick(row){
  const b=arrivals.find(x=>x.row===row);if(!b)return;
  if(b.partyId){openParty(b.partyId,b.date);return}

  renderArrivals();$('formTop').scrollIntoView({behavior:'smooth'});
  const empty=[...$('guests').querySelectorAll('input')].find(i=>!i.value);(empty||$('guests').querySelector('input')).focus();

async function checkEmail(){
  const b=$('mailBtn');b.disabled=true;b.textContent='Checking…';
  try{const n=await call('checkEmail');toast(n?`Imported ${n} bookings from email`:'No new report in email yet',3500);loadArrivals()}

/* Toast dates look like "10/29/2026, 12:30:00 PM" */
function toDate(v){
  if(v instanceof Date)return isNaN(v)?null:v;
  const m=/(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s+(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)/i.exec(String(v));
  if(!m){const d=new Date(String(v));return isNaN(d)?null:d}
  let h=+m[4]%12;if(/pm/i.test(m[6]))h+=12;return new Date(+m[3],+m[1]-1,+m[2],h,+m[5]);
}
function fmtPhone(v){const d=String(v).replace(/\D/g,'').replace(/^1(?=\d{10}$)/,'');return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:String(v).trim()}
/* Reads the Toast "Bookings" report download (CSV or Excel). Column names are matched loosely. */
async function importFile(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
    if(!rows.length)throw new Error('empty file');
    const keys=Object.keys(rows[0]),K=re=>keys.find(k=>re.test(k.toLowerCase()));
    const kFirst=K(/first/),kLast=K(/last/),kName=K(/^(guest )?name$|full name|guest name/),kEmail=K(/e-?mail/),kPhone=K(/phone|mobile/),
      kSize=K(/party size/)||K(/party|size|covers|guests/),kStart=K(/expected start/)||K(/start|date|time/),kStatus=K(/^status$/)||K(/status/),
      kNote=K(/special request/),kType=K(/^type$/);
    if(!kStart||!(kFirst||kName))throw new Error('could not find name/time columns ('+keys.join(', ')+')');
    const out=[];
    rows.forEach(r=>{
      if(kStatus&&/cancel|no.?show/i.test(r[kStatus]))return;
      if(kType&&/waitlist/i.test(r[kType]))return;
      const d=toDate(r[kStart]);if(!d)return;
      const name=titleCase(kName?String(r[kName]):(String(r[kFirst])+' '+String(kLast?r[kLast]:'')));if(!name.trim())return;
      out.push({date:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),
        time:d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}),reservation:name,
        size:parseInt(r[kSize])||1,phone:kPhone?fmtPhone(r[kPhone]):'',email:kEmail?String(r[kEmail]).trim():'',
        note:kNote?String(r[kNote]).trim():''});
    });
    if(!out.length)throw new Error('no bookings found');
    const res=await call('importBookings',out);
    toast(`Imported ${res.imported} bookings`,3500);loadArrivals();
  }catch(e){toast('Import failed: '+(e.message||e),6000)}
}

function money(n){n=+n||0;return n%1?n.toFixed(2):String(n)}
/* Reads the FareHarbor bookings export (CSV or Excel). Every booking gets the FH tag and its deposit. */
async function importFH(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
    if(!rows.length)throw new Error('empty file');
    const keys=Object.keys(rows[0]),K=(...res)=>{for(const re of res){const k=keys.find(k=>re.test(k.toLowerCase().trim()));if(k)return k}};
    const kStart=K(/^start$/,/^start (date|at)/,/availability.*start/,/^start/,/^date$/,/date/),
      kTime=K(/^start time$/,/^time$/,/time/),
      kFirst=K(/first name/),kLast=K(/last name/),
      kName=K(/^contact( name)?$/,/contact.*name/,/customer name|full name|^name$|guest name/),
      kEmail=K(/contact.*e-?mail/,/e-?mail/),kPhone=K(/contact.*phone/,/phone|mobile/),
      kSize=K(/^total pax$|^# ?(of )?pax|^pax$/,/pax/,/party size|^guests$|number of guests|^customers$|^qty$|quantity/),
      kPaid=K(/^total paid$/,/amount paid/,/^paid$/,/deposit/,/paid/),
      kId=K(/^booking (id|#|number|pk)$/,/^booking$/,/^#$|^id$|^pk$/,/booking.*(id|#|number)/),
      kStatus=K(/^status$/,/status/),kNote=K(/note/,/special/);
    if(!kStart||!(kName||kFirst))throw new Error('could not find the date or name columns ('+keys.join(', ')+')');
    const out=[];let skipped=0;
    rows.forEach(r=>{
      if(kStatus&&/cancel|rebooked|no.?show|refund/i.test(r[kStatus])){skipped++;return}
      let raw=String(r[kStart]);if(kTime&&kTime!==kStart&&!/\d:\d\d/.test(raw))raw+=' '+r[kTime];
      const d=r[kStart] instanceof Date?r[kStart]:toDate(raw)||toDate(raw.replace(/\b(at|@)\b/i,' ').replace(/(\d)(am|pm)/i,'$1 $2'));
      if(!d){skipped++;return}
      const name=titleCase(kName?String(r[kName]):(String(r[kFirst])+' '+String(kLast?r[kLast]:'')));if(!name.trim()){skipped++;return}
      const date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if(date<today()){skipped++;return}   // only upcoming bookings
      out.push({date,time:d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}),reservation:name,
        size:parseInt(r[kSize])||1,phone:kPhone?fmtPhone(r[kPhone]):'',email:kEmail?String(r[kEmail]).trim():'',
        note:kNote?String(r[kNote]).trim().slice(0,300):'',deposit:kPaid?parseFloat(String(r[kPaid]).replace(/[^\d.]/g,''))||0:0,
        fhId:kId?String(r[kId]).replace(/^#/,'').trim():''});
    });
    if(!out.length)throw new Error('no upcoming bookings found');
    const dep=out.reduce((s,b)=>s+b.deposit,0),ppl=out.reduce((s,b)=>s+b.size,0);
    if(!confirm(`Import ${out.length} FareHarbor bookings (${ppl} guests, $${money(dep)} in deposits)?\nFirst: ${out[0].reservation} · ${niceDate(out[0].date)} ${out[0].time}`+(skipped?`\n${skipped} rows skipped (cancelled or past).`:'')))return;
    const res=await call('importFareHarbor',out);
    toast(`FareHarbor: ${res.added} added${res.updated?`, ${res.updated} updated`:''}`,4000);loadArrivals();
  }catch(e){toast('FareHarbor import failed: '+(e.message||e),7000)}
}

/* ---------- Schedule: seats per class, one tap ---------- */
let SCH=null;
function schedShift(n){const [y,m,d]=$('schedDay').value.split('-').map(Number);const x=new Date(y,m-1,d+n);
  $('schedDay').value=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');loadSched()}
async function loadSched(){
  if(!$('schedDay').value)$('schedDay').value=today();
  $('schedBox').innerHTML='<p class="muted">Loading…</p>';
  try{SCH=await call('getSchedule',$('schedDay').value);renderSched()}catch(e){$('schedBox').innerHTML=`<p class="muted">Could not load: ${esc(e.message||e)}</p>`}
}
function renderSched(){
  const d=SCH,title=niceDate(d.date);
  if(!d.dayOpen){$('schedBox').innerHTML=`<div class="card sday closed"><div><b style="font-size:20px">${esc(title)}</b><br>
    <span class="muted">${d.regular?'Closed for booking':'Not a regular class day'}</span></div>
    <button class="btn main" style="width:auto;padding:0 22px" onclick="setCap('*',${d.regular?'null':d.defaultCap})">Open this day</button></div>`;return}
  $('schedBox').innerHTML=`<div class="card sday"><div><b style="font-size:20px">${esc(title)}</b><br><span class="muted">Online booking is open</span></div>
      <button class="btn ghost" style="border-color:#c40056;color:#c40056" onclick="if(confirm('Close ALL classes on ${esc(title)} for new bookings?'))setCap('*',0)">Close whole day</button></div>`+
    d.classes.map(c=>{const closed=c.cap===0,full=!closed&&c.booked>=c.cap,pct=c.cap?Math.min(100,c.booked/c.cap*100):100;
      return `<div class="card scls${closed?' off':''}">
        <div class="stime"><b>${c.time}</b><span class="muted">${closed?'Closed':full?'Full':(c.cap-c.booked)+' open'}</span></div>
        <div class="sbar"><div style="width:${pct}%"></div></div>
        <div class="scount"><b>${c.booked}</b> booked of</div>
        <div class="scap"><input type="number" min="0" max="99" inputmode="numeric" value="${c.cap}" data-t="${c.time}" aria-label="Seats for ${c.time}"
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}" onfocus="this.select()" onblur="capInput(this)"><span class="seatl">seats</span></div>
        <button class="btn ghost small" onclick="setCap('${c.time}',${closed?d.defaultCap:0})">${closed?'Open':'Close'}</button>
        ${c.custom?`<button class="tl" onclick="setCap('${c.time}',null)">Reset to ${d.defaultCap}</button>`:''}
      </div>`}).join('');
}
function capInput(el){
  const n=parseInt(el.value,10),c=SCH.classes.find(x=>x.time===el.dataset.t);
  if(isNaN(n)||n<0){el.value=c.cap;return}
  if(n===c.cap)return;
  el.classList.add('saving');setCap(el.dataset.t,n);
}
async function setCap(time,n){
  // show the change instantly, save in the background
  const prev=JSON.stringify(SCH);
  if(time==='*'){if(n===0)SCH.dayOpen=false;else{SCH.dayOpen=true;SCH.classes.forEach(c=>{c.cap=SCH.defaultCap;c.custom=false})}}
  else{const c=SCH.classes.find(x=>x.time===time);c.cap=n===null?SCH.defaultCap:n;c.custom=n!==null}
  renderSched();
  try{const fresh=await call('setCapacity',SCH.date,time,n);if(fresh.date===SCH.date){SCH=fresh;if(!document.activeElement||!document.activeElement.dataset||!document.activeElement.dataset.t)renderSched()}toast('Saved · booking page updated')}
  catch(e){SCH=JSON.parse(prev);renderSched();toast('Not saved: '+(e.message||e),5000)}
}
